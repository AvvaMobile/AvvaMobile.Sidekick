<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Relay</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', sans-serif; }
      button {
        width: 50px; height: 50px; border-radius: 50%; padding: 0 0 3px; cursor: pointer;
        border: 1px solid rgba(255, 255, 255, .22); background: #2f7bf5; color: #fff;
        font-size: 27px; font-weight: 700; line-height: 1;
        box-shadow: 0 0 0 5px rgba(16, 18, 22, .55), 0 0 18px 10px rgba(0, 0, 0, .45), 0 8px 26px rgba(0, 0, 0, .55);
        transition: transform 120ms ease, background 120ms;
      }
      button:hover:not(:disabled) { background: #4a8ef7; transform: scale(1.06); }
      button:disabled { background: #3a3f48; color: #8a8f98; cursor: default; }
      button:focus-visible { outline: 2px solid #9cc2ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <button id="claude" aria-label="Send to Claude" title="Send to Claude" disabled>»</button>
    <button id="chatgpt" aria-label="Send to ChatGPT" title="Send to ChatGPT" disabled>«</button>
    <script type="module" src="./relay.ts"></script>
  </body>
</html>
